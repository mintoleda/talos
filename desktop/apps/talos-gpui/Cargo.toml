[package]
name = "talos-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "talos-gpui"
path = "src/main.rs"

[dependencies]
# Reuse the frontend-neutral daemon bridge and projection.
chrono.workspace = true
directories.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
talos-ipc = { path = "../../crates/talos-ipc" }
async-channel = "2"
gpui = { git = "https://github.com/zeronsh/zui", rev = "15ee7082c4f910618be306166436a6d9fe0451be" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "15ee7082c4f910618be306166436a6d9fe0451be", default-features = false, features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "cab50b071497683a119ae0e4038880f195c0f23f" }

[lints]
workspace = true
