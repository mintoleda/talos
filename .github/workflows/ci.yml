name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  desktop-backend:
    name: Desktop backend acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Backend strict lint baseline
        run: cargo clippy --workspace --all-targets --exclude talos-desktop --locked -- -D warnings
      - name: Backend tests
        run: cargo test --workspace --exclude talos-desktop --locked
      - name: Build process acceptance binaries
        run: cargo build --locked -p talosd -p talosdctl -p paseo-acp --bins
      - name: Isolated daemon and CLI acceptance
        run: python3 scripts/talosd-smoke.py --verbose --timeout 300

  # The full-workspace gates are still known-failing (see desktop/docs/STATUS.md).
  # They run here for signal only until the desktop UI workstream closes them.
  desktop-ui:
    name: Desktop UI gates (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config desktop-file-utils libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Validate Linux integration assets
        run: |
          bash -n packaging/install-user.sh
          desktop-file-validate packaging/desktop/talos-desktop.desktop
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
